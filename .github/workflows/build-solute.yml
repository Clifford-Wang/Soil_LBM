name: Build Solute Transport Native CUDA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.private/solute_transport/source.enc'
      - '.github/workflows/build-solute.yml'

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 120
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install CUDA Toolkit 12.8.1
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'
          use-github-cache: true
      - name: Decrypt private CUDA build input
        shell: bash
        env:
          SOLUTE_BUILD_KEY: ${{ secrets.SOLUTE_BUILD_KEY }}
        run: |
          set -euo pipefail
          test -n "${SOLUTE_BUILD_KEY:-}"
          mkdir -p .solute_build
          if command -v openssl >/dev/null 2>&1; then OPENSSL=openssl;
          else OPENSSL="/c/Program Files/Git/usr/bin/openssl.exe"; fi
          "$OPENSSL" enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in .private/solute_transport/source.enc \
            -out .solute_build/source.tar.gz \
            -pass env:SOLUTE_BUILD_KEY
          tar -xzf .solute_build/source.tar.gz -C .solute_build
          test -s .solute_build/solver.cu
          test -s .solute_build/trial_guard.cpp
      - name: Configure native CUDA build
        shell: pwsh
        run: cmake -S .solute_build -B build-solute -A x64
      - name: Validate host-side benchmarks
        shell: pwsh
        run: |
          cmake --build build-solute --config Release --target LBM_Solute_HostValidation --parallel
          & .\build-solute\Release\LBM_Solute_HostValidation.exe
      - name: Compile native CUDA EXE
        shell: pwsh
        run: |
          cmake --build build-solute --config Release --target LBM_SoluteTransport --parallel
          if (!(Test-Path build-solute\Release\LBM_SoluteTransport.exe)) {
            throw 'Native solute transport EXE was not produced.'
          }
      - name: Assemble executable-only artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build-solute\Release\LBM_SoluteTransport.exe dist\
          Copy-Item Solute_transport\release\config_solute.txt dist\
          Copy-Item Solute_transport\release\run_solute.bat dist\
      - name: Upload EXE-only release candidate
        uses: actions/upload-artifact@v4
        with:
          name: SoluteLBM-native-release-candidate
          path: dist/*
          if-no-files-found: error
