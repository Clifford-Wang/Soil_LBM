name: Publish LEV MRT CUDA EXE

on:
  workflow_run:
    workflows: ['Build LEV MRT Native CUDA']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful LEV MRT build run ID'
        required: true

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download build artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN" --name LEVMRT-native-release-candidate --dir build-output
          test -s build-output/LBM_LEV_MRT.exe
      - name: Publish LEV MRT EXE only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Single_phase/LEV_MRT/release
          cp build-output/LBM_LEV_MRT.exe Single_phase/LEV_MRT/release/LBM_LEV_MRT.exe
          git config user.name 'Clifford'
          git config user.email '167417015+Clifford-Wang@users.noreply.github.com'
          git add Single_phase/LEV_MRT/release/LBM_LEV_MRT.exe
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish LEV MRT native CUDA executable [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
