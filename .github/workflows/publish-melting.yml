name: Publish Melting CUDA EXE

on:
  workflow_run:
    workflows: ['Build Melting Native CUDA']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful Windows native CUDA melting build run ID'
        required: true

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download successful build artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN" --name MeltingLBM-native-release-candidate --dir build-output
          test -s build-output/LBM_Melting_MRT.exe

      - name: Publish the native executable only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Melting/release
          cp build-output/LBM_Melting_MRT.exe Melting/release/LBM_Melting_MRT.exe
          git config user.name 'Clifford'
          git config user.email '167417015+Clifford-Wang@users.noreply.github.com'
          git add Melting/release/LBM_Melting_MRT.exe
          if git diff --cached --quiet; then
            echo 'Melting native CUDA executable already published'
            exit 0
          fi
          git commit -m 'Publish native CUDA melting executable [skip ci]'
          git pull --rebase origin main
          git push origin HEAD:main
